<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>课题组打卡 · 姓名与位置</title>
  <style>
    *{box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif}
    body{margin:0;min-height:100vh;padding:20px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#f5f7fa,#e9edf2)}
    .card{width:100%;max-width:440px;padding:30px 26px;background:rgba(255,255,255,.93);border:1px solid #fff;border-radius:30px;box-shadow:0 20px 40px -10px #00141f40}
    h1{margin:0 0 8px;color:#1e2b3a;font-size:2rem}
    h1 span{padding:4px 11px;border-radius:30px;color:#fff;background:#2a7faa;font-size:1.1rem}
    .subtitle{margin-bottom:26px;padding-bottom:10px;border-bottom:1px dashed #cbd5e0;color:#5b6f82}
    .subtitle i{font-style:normal;margin-left:8px;padding:4px 9px;border-radius:20px;background:#e2eaf1;font-size:.8rem}
    .field{margin-bottom:22px}
    label{display:block;margin-bottom:7px;color:#1e3b4f;font-weight:600}
    label i{color:#c0392b;font-style:normal}
    .input-wrap{background:#fff;border:1.5px solid #d4e0e9;border-radius:18px}
    .input-wrap:focus-within{border-color:#2a7faa;box-shadow:0 0 0 4px #2a7faa26}
    input{width:100%;padding:15px 17px;border:0;outline:0;border-radius:18px;background:transparent;font-size:1.05rem}
    .location-box{min-height:88px;padding:16px;border:1px solid #cfdee9;border-radius:18px;background:#f0f5fa}
    .location-header{margin-bottom:7px;color:#1e3b4f;font-weight:600}
    .location-status{color:#1e2b3a;line-height:1.5}
    .coords{display:none;margin-top:8px;padding:8px 10px;border-radius:11px;background:#fff;color:#2a5f7a;font-size:.88rem;line-height:1.45;word-break:break-word}
    .error-text{padding:7px 10px;border-radius:10px;background:#ffe9e9;color:#b13e3e}
    .buttons{display:flex;gap:12px;margin-top:10px}
    .btn{flex:1;padding:15px 10px;border:0;border-radius:30px;font-size:1rem;font-weight:600;cursor:pointer}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .secondary{border:1px solid #cbdae5;background:#fff;color:#1e3b4f}
    .primary{background:#1e3b4f;color:#fff}
    .feedback{display:none;margin-top:18px;padding:13px 16px;border:1px solid #b8d9b8;border-radius:16px;background:#e6f2e6;color:#1f5e3a;white-space:pre-line;word-break:break-word}
    .feedback.show{display:block}
    .feedback.error{border-color:#e6bcbc;background:#fdeaea;color:#a12b2b}
    .note{margin-top:20px;padding-top:14px;border-top:1px solid #d8e2eb;text-align:center;color:#7e93a5;font-size:.8rem}
    .note i{font-style:normal}
  </style>
</head>
<body>
  <main class="card">
    <h1>📋 打卡 <span>课题组</span></h1>
    <div class="subtitle">填写姓名并获取位置 <i>多次采样</i></div>

    <div class="field">
      <label for="nameInput">姓名 <i>*</i></label>
      <div class="input-wrap">
        <input id="nameInput" type="text" placeholder="例如：张三" autocomplete="name" maxlength="30">
      </div>
    </div>

    <div class="field">
      <label>📍 当前位置</label>
      <div class="location-box">
        <div class="location-header">🌍 定位状态</div>
        <div id="locationStatus" class="location-status">尚未获取位置信息</div>
        <div id="coordsDisplay" class="coords"></div>
      </div>
    </div>

    <div class="buttons">
      <button class="btn secondary" id="locateBtn">📡 获取位置</button>
      <button class="btn primary" id="checkinBtn">✅ 打卡</button>
    </div>

    <div id="feedback" class="feedback"></div>

    <div class="note">
      <i>请在 HTTPS 或 localhost 环境打开，并允许浏览器使用定位</i>
    </div>
  </main>

  <script>
    (() => {
      const nameInput = document.getElementById('nameInput');
      const locateBtn = document.getElementById('locateBtn');
      const checkinBtn = document.getElementById('checkinBtn');
      const locationStatus = document.getElementById('locationStatus');
      const coordsDisplay = document.getElementById('coordsDisplay');
      const feedback = document.getElementById('feedback');

      // ==================================================
      // 第 152 行：把下面的文字替换成你自己的高德 Web 服务 Key
      // ==================================================
      const AMAP_KEY = '973f4b57341544a4f077f342df684799';

      let currentPosition = null;
      let locationError = '';
      let isLocating = false;
      let watchId = null;
      let samples = [];
      let stopTimer = null;

      function showFeedback(message, error = false) {
        feedback.textContent = message;
        feedback.classList.toggle('error', error);
        feedback.classList.add('show');
      }

      function updateUI() {
        if (isLocating) {
          locationStatus.textContent = '正在采集定位数据，请保持设备静止...';
          locationStatus.style.color = '#2a7faa';
          coordsDisplay.style.display = 'none';
          return;
        }

        if (locationError) {
          locationStatus.innerHTML =
            `<span class="error-text">⚠️ ${locationError}</span>`;
          coordsDisplay.style.display = 'none';
          return;
        }

        if (!currentPosition) {
          locationStatus.textContent = '尚未获取位置信息';
          locationStatus.style.color = '#1e2b3a';
          coordsDisplay.style.display = 'none';
          return;
        }

        locationStatus.textContent = currentPosition.address
          ? '✅ 位置和地址已获取'
          : '✅ 坐标已获取，正在解析地址...';

        locationStatus.style.color = '#1f5e3a';

        coordsDisplay.textContent = currentPosition.address
          ? `地址：${currentPosition.address}
精度约：${Math.round(currentPosition.accuracy)} 米`
          : `经纬度：${currentPosition.longitude.toFixed(6)}, ${currentPosition.latitude.toFixed(6)}
精度约：${Math.round(currentPosition.accuracy)} 米`;

        coordsDisplay.style.display = 'block';
      }

      function finishWatch() {
        if (watchId !== null) {
          navigator.geolocation.clearWatch(watchId);
        }

        watchId = null;
        clearTimeout(stopTimer);
        isLocating = false;
        locateBtn.disabled = false;

        if (!samples.length) {
          locationError = '没有采集到有效位置，请打开 GPS 后重试';
          updateUI();
          showFeedback('❌ ' + locationError, true);
          return;
        }

        // 选择 accuracy 最小的一次，数值越小代表浏览器报告的误差范围越小
        const best = samples.reduce((a, b) =>
          a.accuracy <= b.accuracy ? a : b
        );

        currentPosition = best;
        updateUI();

        showFeedback(
          `📍 定位完成，当前报告精度约 ${Math.round(best.accuracy)} 米，正在解析地址...`
        );

        reverseGeocode(best);
      }

      function getLocation() {
        if (isLocating) return;

        if (!window.isSecureContext && location.hostname !== 'localhost') {
          locationError =
            '定位需要 HTTPS 或 localhost 环境，不能直接用 file:// 打开';
          updateUI();
          showFeedback('❌ ' + locationError, true);
          return;
        }

        if (!navigator.geolocation) {
          locationError = '当前浏览器不支持地理定位';
          updateUI();
          showFeedback('❌ ' + locationError, true);
          return;
        }

        currentPosition = null;
        locationError = '';
        samples = [];
        isLocating = true;
        locateBtn.disabled = true;
        updateUI();

        showFeedback(
          '📡 正在多次采样，请保持设备静止，最多等待 15 秒...'
        );

        watchId = navigator.geolocation.watchPosition(
          position => {
            const {
              latitude,
              longitude,
              accuracy
            } = position.coords;

            if (
              !Number.isFinite(latitude) ||
              !Number.isFinite(longitude) ||
              !Number.isFinite(accuracy)
            ) {
              return;
            }

            samples.push({
              latitude,
              longitude,
              accuracy,
              address: ''
            });

            const best = samples.reduce((a, b) =>
              a.accuracy <= b.accuracy ? a : b
            );

            currentPosition = best;
            updateUI();

            // 达到较好精度时提前结束；否则继续采样
            if (accuracy <= 30 || samples.length >= 8) {
              finishWatch();
            }
          },

          error => {
            if (watchId !== null) {
              navigator.geolocation.clearWatch(watchId);
            }

            watchId = null;
            clearTimeout(stopTimer);
            isLocating = false;
            locateBtn.disabled = false;

            if (error.code === 1) {
              locationError =
                '你拒绝了定位权限，请在浏览器设置中允许';
            } else if (error.code === 2) {
              locationError =
                '位置信息不可用，请打开 GPS 或到室外重试';
            } else {
              locationError = '定位超时，请重试';
            }

            updateUI();
            showFeedback('❌ ' + locationError, true);
          },

          {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
          }
        );

        stopTimer = setTimeout(finishWatch, 15000);
      }

      async function reverseGeocode(position) {
        if (!AMAP_KEY || AMAP_KEY.includes('请替换')) {
          showFeedback(
            '✅ 坐标已获取，但还没有填写高德 Web 服务 Key',
            true
          );
          locateBtn.disabled = false;
          return;
        }

        const url =
          `https://restapi.amap.com/v3/geocode/regeo` +
          `?location=${position.longitude},${position.latitude}` +
          `&key=${encodeURIComponent(AMAP_KEY)}` +
          `&extensions=base`;

        try {
          const response = await fetch(url);
          const data = await response.json();

          if (data.status === '1' && data.regeocode) {
            currentPosition.address =
              data.regeocode.formatted_address;

            updateUI();
            showFeedback('📍 详细地址解析成功');
          } else {
            console.error('高德逆地理编码失败：', data);
            showFeedback(
              '⚠️ 地址解析失败，但坐标已经获取',
              true
            );
          }
        } catch (error) {
          console.error('地址解析网络错误：', error);
          showFeedback(
            '⚠️ 地址解析网络错误，但坐标已经获取',
            true
          );
        } finally {
          locateBtn.disabled = false;
        }
      }

      function handleCheckin() {
        const name = nameInput.value.trim();

        if (!name) {
          showFeedback('✏️ 请填写您的姓名', true);
          nameInput.focus();
          return;
        }

        if (isLocating) {
          showFeedback('⏳ 正在多次采集位置，请稍等...');
          return;
        }

        if (!currentPosition) {
          showFeedback('📍 请先点击“获取位置”按钮', true);
          return;
        }

        if (
          !currentPosition.address &&
          AMAP_KEY &&
          !AMAP_KEY.includes('请替换')
        ) {
          showFeedback('⏳ 地址还在解析，请稍等...', true);
          return;
        }

        const time = new Date().toLocaleString(
          'zh-CN',
          { hour12: false }
        );

        const address = currentPosition.address ||
          `坐标：${currentPosition.longitude.toFixed(6)}, ${currentPosition.latitude.toFixed(6)}`;

        showFeedback(
          `✅ 打卡成功！
姓名：${name}
位置：${address}
时间：${time}`
        );

        console.log('【打卡记录】', {
          name,
          address,
          latitude: currentPosition.latitude,
          longitude: currentPosition.longitude,
          accuracy: currentPosition.accuracy,
          time
        });
      }

      locateBtn.addEventListener('click', getLocation);
      checkinBtn.addEventListener('click', handleCheckin);
      updateUI();
    })();
  </script>
</body>
</html>
