<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>课题组打卡 · 姓名与位置</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f5f7fa 0%, #e9edf2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 36px;
            box-shadow: 0 20px 40px -10px rgba(0, 20, 30, 0.25), 0 8px 20px -6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 440px;
            padding: 32px 28px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: transform 0.2s ease;
        }

        .card:active {
            transform: scale(0.995);
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            color: #1e2b3a;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        h1 span {
            background: #2a7faa;
            color: white;
            font-size: 1.2rem;
            font-weight: 500;
            padding: 4px 12px;
            border-radius: 40px;
            letter-spacing: 0.3px;
        }

        .subtitle {
            color: #5b6f82;
            font-size: 0.95rem;
            margin-bottom: 28px;
            padding-bottom: 6px;
            border-bottom: 1.5px dashed #cbd5e0;
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .subtitle i {
            font-style: normal;
            background: #e2eaf1;
            border-radius: 30px;
            padding: 4px 10px;
            font-size: 0.8rem;
            color: #1e3b4f;
        }

        .field {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            color: #1e3b4f;
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }

        label i {
            font-style: normal;
            color: #c0392b;
            margin-left: 4px;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background: white;
            border-radius: 20px;
            border: 1.5px solid #d4e0e9;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
        }

        .input-wrapper:focus-within {
            border-color: #2a7faa;
            box-shadow: 0 0 0 4px rgba(42, 127, 170, 0.15);
        }

        .input-wrapper input {
            width: 100%;
            padding: 16px 18px;
            border: none;
            background: transparent;
            font-size: 1.1rem;
            font-weight: 500;
            color: #0b1a26;
            outline: none;
            border-radius: 20px;
        }

        .input-wrapper input::placeholder {
            color: #98aeba;
            font-weight: 400;
            font-size: 1rem;
        }

        .location-box {
            background: #f0f5fa;
            border-radius: 20px;
            padding: 18px 18px;
            margin-bottom: 16px;
            border: 1px solid #cfdee9;
            transition: all 0.2s;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .location-header {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #1e3b4f;
            font-weight: 500;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .location-header .icon {
            font-size: 1.2rem;
        }

        #locationStatus {
            font-size: 0.95rem;
            color: #1e2b3a;
            word-break: break-word;
            line-height: 1.5;
            transition: color 0.2s;
        }

        .coords {
            font-size: 0.9rem;
            color: #2a5f7a;
            background: white;
            padding: 8px 12px;
            border-radius: 12px;
            margin-top: 6px;
            display: none; /* 初始隐藏，有数据时显示 */
            border: 1px solid #cbdae5;
            word-break: break-all;
            line-height: 1.4;
        }

        .error-text {
            color: #b13e3e;
            font-weight: 500;
            background: #ffe9e9;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 0.9rem;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            padding: 16px 12px;
            border-radius: 40px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
            background: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.02);
            border: 1.5px solid transparent;
        }

        .btn-primary {
            background: #1e3b4f;
            color: white;
            box-shadow: 0 10px 18px -8px rgba(30, 59, 79, 0.3);
        }

        .btn-primary:hover {
            background: #14303f;
            transform: translateY(-1px);
        }

        .btn-primary:active {
            transform: translateY(1px);
            box-shadow: 0 5px 12px -6px #1e3b4f;
        }

        .btn-secondary {
            background: white;
            border-color: #cbdae5;
            color: #1e3b4f;
        }

        .btn-secondary:hover {
            background: #f6faff;
            border-color: #a0bbce;
        }

        .btn-secondary:active {
            background: #e8f0f7;
        }

        .btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none;
        }

        .feedback {
            margin-top: 20px;
            padding: 14px 18px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 500;
            text-align: left;
            background: #e6f2e6;
            color: #1f5e3a;
            border: 1px solid #b8d9b8;
            display: none;
            word-break: break-word;
            white-space: pre-line; /* 支持换行 */
        }

        .feedback.show {
            display: block;
            animation: fadeIn 0.25s ease;
        }

        .feedback.error {
            background: #fdeaea;
            color: #a12b2b;
            border-color: #e6bcbc;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(8px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .note {
            font-size: 0.8rem;
            color: #7e93a5;
            text-align: center;
            margin-top: 22px;
            border-top: 1px solid #d8e2eb;
            padding-top: 16px;
        }

        .note i {
            font-style: normal;
            display: inline-block;
            background: #e2eaf1;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: #1a3a4f;
        }

        @media (max-width: 380px) {
            .card { padding: 24px 18px; }
            h1 { font-size: 1.7rem; }
            .btn { font-size: 0.9rem; padding: 14px 8px; }
        }
    </style>
</head>
<body>
<div class="card">
    <h1>📋 打卡 <span>课题组</span></h1>
    <div class="subtitle">
        填写姓名并获取位置
        <i>自动定位</i>
    </div>

    <div class="field">
        <label for="nameInput">姓名 <i>*</i></label>
        <div class="input-wrapper">
            <input type="text" id="nameInput" placeholder="例如：张三" autocomplete="name" maxlength="30">
        </div>
    </div>

    <div class="field">
        <label>📍 当前位置</label>
        <div class="location-box" id="locationBox">
            <div class="location-header">
                <span class="icon">🌍</span> 定位状态
            </div>
            <div id="locationStatus">尚未获取位置信息</div>
            <div id="coordsDisplay" class="coords"></div>
        </div>
    </div>

    <div class="button-group">
        <button class="btn btn-secondary" id="locateBtn">
            <span>📡</span> 获取位置
        </button>
        <button class="btn btn-primary" id="checkinBtn">
            <span>✅</span> 打卡
        </button>
    </div>

    <div class="feedback" id="feedback"></div>

    <div class="note">
        <i>位置将用于课题组打卡记录，请授权定位</i>
    </div>
</div>

<script>
    (function() {
        const nameInput = document.getElementById('nameInput');
        const locateBtn = document.getElementById('locateBtn');
        const checkinBtn = document.getElementById('checkinBtn');
        const locationStatus = document.getElementById('locationStatus');
        const coordsDisplay = document.getElementById('coordsDisplay');
        const feedback = document.getElementById('feedback');

        // 状态变量
        let currentPosition = null; // 存储 { latitude, longitude, accuracy, address }
        let locationError = null;
        let isLocating = false;

        // 显示反馈信息
        function showFeedback(message, isError = false) {
            feedback.textContent = message;
            feedback.classList.add('show');
            if (isError) {
                feedback.classList.add('error');
            } else {
                feedback.classList.remove('error');
            }
            clearTimeout(window.feedbackTimer);
            window.feedbackTimer = setTimeout(() => {
                feedback.classList.remove('show');
            }, 8000); // 延长显示时间，方便看地址
        }

        // 更新定位UI
        function updateLocationUI() {
            if (isLocating) {
                locationStatus.textContent = '正在获取位置...';
                locationStatus.style.color = '#2a7faa';
                coordsDisplay.style.display = 'none';
                return;
            }

            if (locationError) {
                locationStatus.innerHTML = `<span class="error-text">⚠️ ${locationError}</span>`;
                coordsDisplay.style.display = 'none';
                return;
            }

            if (currentPosition) {
                locationStatus.textContent = '✅ 位置已获取';
                locationStatus.style.color = '#1f5e3a';
                
                // 如果已有地址显示地址，否则显示经纬度或正在解析
                if (currentPosition.address) {
                    coordsDisplay.textContent = `地址：${currentPosition.address}`;
                } else {
                    coordsDisplay.textContent = `经纬度：${currentPosition.longitude.toFixed(6)}, ${currentPosition.latitude.toFixed(6)} (正在解析街道地址...)`;
                }
                coordsDisplay.style.display = 'block';
            } else {
                locationStatus.textContent = '尚未获取位置信息';
                locationStatus.style.color = '#1e2b3a';
                coordsDisplay.style.display = 'none';
            }
        }

        // 获取位置及逆地理编码
        function getLocation() {
            if (isLocating) return;
            if (!navigator.geolocation) {
                locationError = '您的浏览器不支持地理定位';
                updateLocationUI();
                showFeedback('❌ 浏览器不支持地理定位', true);
                return;
            }

            currentPosition = null;
            locationError = null;
            isLocating = true;
            updateLocationUI();
            feedback.classList.remove('show');

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    isLocating = false;
                    currentPosition = {
                        latitude: position.coords.latitude,
                        longitude: position.coords.longitude,
                        accuracy: position.coords.accuracy
                    };
                    updateLocationUI();
                    showFeedback('📍 坐标获取成功，正在解析详细地址...', false);

                    // ==========================================
                    // 调用高德地图逆地理编码 API
                    // 请将下面的 Key 替换为你新申请的 Web服务 Key
                    const amapKey = '973f4b57341544a4f077f342df684799'; 
                    // ==========================================
                    
                    const url = `https://restapi.amap.com/v3/geocode/regeo?location=${currentPosition.longitude},${currentPosition.latitude}&key=${amapKey}`;
                    
                    fetch(url)
                        .then(res => res.json())
                        .then(data => {
                            if (data.status === '1' && data.regeocode) {
                                currentPosition.address = data.regeocode.formatted_address;
                                updateLocationUI();
                                showFeedback('📍 详细地址解析成功！', false);
                            } else {
                                console.error('高德解析失败:', data);
                                currentPosition.address = '解析地址失败，请重试';
                                updateLocationUI();
                                showFeedback('⚠️ 地址解析失败，但经纬度已获取', true);
                            }
                        })
                        .catch(err => {
                            console.error('网络请求失败:', err);
                            currentPosition.address = '网络异常，无法解析地址';
                            updateLocationUI();
                            showFeedback('⚠️ 地址解析网络错误', true);
                        });
                },
                (error) => {
                    isLocating = false;
                    currentPosition = null;
                    switch (error.code) {
                        case error.PERMISSION_DENIED: locationError = '您拒绝了位置权限请求。请允许定位后重试。'; break;
                        case error.POSITION_UNAVAILABLE: locationError = '位置信息不可用，请检查设备定位功能。'; break;
                        case error.TIMEOUT: locationError = '获取位置超时，请检查网络。'; break;
                        default: locationError = '获取位置失败：' + error.message; break;
                    }
                    updateLocationUI();
                    showFeedback('❌ ' + locationError, true);
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
            );
        }

        // 打卡逻辑
        function handleCheckin() {
            const name = nameInput.value.trim();

            if (!name) {
                showFeedback('✏️ 请填写您的姓名', true);
                nameInput.focus();
                return;
            }

            if (!currentPosition) {
                if (isLocating) {
                    showFeedback('⏳ 正在获取位置，请稍等...', false);
                } else if (locationError) {
                    showFeedback('⚠️ 定位失败，请先点击“获取位置”', true);
                } else {
                    showFeedback('📍 请先点击“获取位置”按钮', true);
                }
                return;
            }

            // 如果没有拿到地址（可能还在请求中或失败），给出提示
            if (!currentPosition.address) {
                showFeedback('⏳ 正在解析您的详细地址，请等提示“解析成功”后再打卡...', true);
                return;
            }

            const finalAddress = currentPosition.address;
            const now = new Date();
            const timeStr = now.toLocaleString('zh-CN', { hour12: false });

            // 显示打卡成功反馈
            const successMsg = `✅ 打卡成功！\n姓名：${name}\n位置：${finalAddress}\n时间：${timeStr}`;
            showFeedback(successMsg, false);

            // 在控制台打印，方便后续接入数据库
            console.log('【打卡记录】', {
                name: name,
                address: finalAddress,
                latitude: currentPosition.latitude,
                longitude: currentPosition.longitude,
                time: timeStr
            });
        }

        // 绑定事件
        locateBtn.addEventListener('click', getLocation);
        checkinBtn.addEventListener('click', handleCheckin);
        
        // 初始化
        updateLocationUI();
    })();
</script>
</body>
</html>
